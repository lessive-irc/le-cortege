function nearest(list){let best=null,bd=Infinity;for(const a of list){let n=dist(a,S.player);if(n<bd){best=a;bd=n}}return{item:best,d:bd}}
function getTarget(){let p=S.player,opts=[...S.bins.filter(x=>!x.done).map(x=>({item:x,d:dist(x,p),kind:'bin'})),...S.windows.filter(x=>!x.done).map(x=>({item:x,d:dist(x,p),kind:'window'})),...S.walls.filter(x=>!x.tag).map(x=>({item:x,d:dist(x,p),kind:'tag'}))].filter(x=>x.d<43);opts.sort((a,b)=>a.d-b.d);return opts[0]||null}

function resolveKey(k){if(['ArrowUp','w','W','z','Z'].includes(k))return'up';if(['ArrowDown','s','S'].includes(k))return'down';if(['ArrowLeft','a','A','q','Q'].includes(k))return'left';if(['ArrowRight','d','D'].includes(k))return'right';if(k==='Shift')return'sprint';if(k==='c'||k==='C')return'blend';return null}
