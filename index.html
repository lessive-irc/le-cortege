function hud(){if(!game)return;$('#targetHint').textContent=tr()[promptKey()]||'';$('#brickCount').textContent=game.brickCount;$('#paintCount').textContent=game.paint;$('#fuelCount').textContent=game.fuel;$('#fireCount').textContent=game.fires+' / 5';$('#windowCount').textContent=game.windows+' / 5';$('#alertState').textContent=game.suspicion<25?'··':game.suspicion<65?'!':'!!';ui.objective.textContent=tr()[game.objective];}
function nearestProp(){let p=game.player,candidates=[];for(const o of zoneProps()){if(o.done)continue;let d=Math.hypot(o.x-p.x,o.y-p.y);if(d<1.3)candidates.push({o,d})}candidates.sort((a,b)=>a.d-b.d);return candidates[0]?.o}
function promptKey(){let p=game.player;if(game.zone==='inside'&&game.inside&&near(p,game.inside.exit,1.05))return'nearExit';if(game.zone==='town'){let door=game.doors.find(b=>near(p,{x:b.doorX+.5,y:b.y+b.h-.5},1.05));if(door)return'nearDoor'}let hit=cast(p.a);if(hit.type===2&&hit.d<2.8)return'nearWindow';let o=nearestProp();if(o)return o.kind==='pickup'?'nearPickup':o.kind==='bin'?(o.burning?'nearNone':'nearBin'):(o.burning?'nearNone':'nearCar');return'nearNone'}
function enterBuilding(b){game.outside={x:game.player.x,y:game.player.y,a:game.player.a};game.inside=game.interiors[b.id]||interiorFor(b);game.interiors[b.id]=game.inside;game.zone='inside';game.grid=game.inside.grid;game.player.x=2.5;game.player.y=8.3;game.player.a=-Math.PI/2;if(!game.inside.prepared){game.inside.props=game.inside.props.map(x=>({...x,kindItem:x.kind,kind:'pickup'}));game.inside.prepared=true}game.objective='objectiveBuild';msg('toastStart')}
function use(){if(!game?.started||game.ending)return;let p=game.player;let prop=nearestProp();if(prop?.kind==='pickup'){if(prop.kindItem==='brick'){game.brickCount+=2;msg('pickupBrick')}if(prop.kindItem==='paint'){game.paint+=2;msg('pickupPaint')}if(prop.kindItem==='fuel'){game.fuel+=2;msg('pickupFuel')}prop.done=true;hud();return}if(game.zone==='inside'&&near(p,game.inside.exit,1.05)){game.zone='town';game.grid=game.townGrid;game.wins=game.townWins;game.player.x=game.outside.x;game.player.y=game.outside.y;game.player.a=game.outside.a;game.inside=null;return}if(game.zone==='town'){let door=game.doors.find(b=>near(p,{x:b.doorX+.5,y:b.y+b.h-.5},1.05));if(door){enterBuilding(door);return}}
let hit=cast(p.a);if(hit.type===2&&hit.d<2.8){game.grid[hit.y][hit.x]=0;game.windows++;msg('windowDone');if(game.windows>=5)game.objective='objectiveExit';hud();return}if(prop?.kind==='bin'||prop?.kind==='car'){if(game.fuel<=0){msg('fireEmpty');return}prop.burning=true;game.fuel--;game.fires++;msg('fireDone');if(game.fires>=5)game.objective='objectiveExit';hud();return}msg('notEnough')}
function spray(){if(!game?.started||game.ending)return;if(game.paint<=0){msg('tagEmpty');return}let p=game.player,h=cast(p.a);if(h.d>5||h.type===0)return;let key=`${game.zone}:${h.x},${h.y}`;game.tags[key]=tr().tags[(Object.keys(game.tags).length)%tr().tags.length];game.paint--;msg('tagDone');hud()}
function throwBrick(){if(!game?.started||game.ending||game.brickCount<=0){msg('brickMiss');return}let p=game.player,target=game.cops.filter(c=>!c.caught&&Math.abs(Math.atan2(Math.sin(Math.atan2(c.y-p.y,c.x-p.x)-p.a),Math.cos(Math.atan2(c.y-p.y,c.x-p.x)-p.a)))<.24).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!target){msg('brickMiss');return}game.brickCount--;let a=Math.atan2(target.y-p.y,target.x-p.x);game.bricks.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:1,target});hud()}
function finish(name){if(game.ending)return;game.ending=name;let e=tr().ends[name];$('#endKicker').textContent=e.k;$('#endTitle').textContent=e.t;$('#endText').textContent=e.b;ui.ending.hidden=false;game.held.clear();if(document.pointerLockElement===canvas)document.exitPointerLock()}
function update(dt){if(!game?.started||game.ending)return;game.elapsed+=dt;let p=game.player,h=game.held,dx=0,dy=0;if(h.has('up'))dy-=1;if(h.has('down'))dy+=1;if(h.has('left'))dx-=1;if(h.has('right'))dx+=1;if(dx||dy){let n=Math.hypot(dx,dy),speed=h.has('sprint')?3.9:2.55;movePlayer((dx*Math.cos(p.a)+dy*Math.sin(p.a))*speed*dt,(dx*Math.sin(p.a)-dy*Math.cos(p.a))*speed*dt)}if(game.zone==='town'){for(const c of game.cops){if(c.stun>0){c.stun-=dt;continue}let d=Math.hypot(p.x-c.x,p.y-c.y),a=Math.atan2(p.y-c.y,p.x-c.x);if(d<8){c.a=a;let step=(game.suspicion>40?1.9:1.1)*dt,nx=c.x+Math.cos(a)*step,ny=c.y+Math.sin(a)*step;if(!blocked(nx,c.y))c.x=nx;if(!blocked(c.x,ny))c.y=ny;if(d<.52)game.suspicion=Math.min(100,game.suspicion+dt*26);else game.suspicion=Math.max(0,game.suspicion-dt*4)}else game.suspicion=Math.max(0,game.suspicion-dt*5);if(d<.5&&game.suspicion>70){finish('caught');return}}}for(let i=game.bricks.length-1;i>=0;i--){let b=game.bricks[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-b.target.x,b.y-b.target.y)<.28){b.target.stun=3.5;game.bricks.splice(i,1);msg('brickHit')}else if(b.life<=0)game.bricks.splice(i,1)}for(const o of zoneProps())if(o.kind==='pickup'&&!o.done&&near(p,o,.35)){/* pickups remain until E */}if(game.fires>=5||game.windows>=5){game.objective='objectiveExit';if(game.zone==='town'&&near(p,{x:23.2,y:19.4},1)){finish('square');return}}if(game.notice>0)game.notice-=dt;hud()}
function loop(ts){let dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;update(dt);render();raf=requestAnimationFrame(loop)}
function keyMap(k){if(['ArrowUp','w','W','z','Z'].includes(k))return'up';if(['ArrowDown','s','S'].includes(k))return'down';if(['ArrowLeft','a','A','q','Q'].includes(k))return'left';if(['ArrowRight','d','D'].includes(k))return'right';if(k==='Shift')return'sprint';return null}addEventListener('keydown',e=>{let k=keyMap(e.key);if(k){e.preventDefault();game?.held.add(k);return}if(e.repeat)return;if(e.key==='e'||e.key==='E')use();if(e.key==='f'||e.key==='F')throwBrick()});addEventListener('keyup',e=>{let k=keyMap(e.key);if(k)game?.held.delete(k)});addEventListener('blur',()=>game?.held.clear());
canvas.addEventListener('click',()=>{if(game?.started&&!game.ending&&document.pointerLockElement!==canvas&&matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>{});document.addEventListener('mousemove',e=>{if(game?.started&&!game.ending&&document.pointerLockElement===canvas)game.player.a+=e.movementX*.0025});canvas.addEventListener('pointerdown',e=>{if(!game?.started||game.ending||e.pointerType!=='mouse')return;if(e.button===0){if(document.pointerLockElement!==canvas)return;spray()}else if(e.button===2){e.preventDefault();throwBrick()}});canvas.addEventListener('contextmenu',e=>e.preventDefault());let drag=null;canvas.addEventListener('pointerdown',e=>{if(matchMedia('(pointer:coarse)').matches){drag={x:e.clientX,id:e.pointerId};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId&&game?.started){game.player.a+=(e.clientX-drag.x)*.009;drag.x=e.clientX}});canvas.addEventListener('pointerup',()=>drag=null);
const keyFor={up:'up',down:'down',left:'left',right:'right',sprint:'sprint'};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='use')use();else if(k==='spray')spray();else if(k==='brick')throwBrick();else if(k==='fire')use();else game?.held.add(keyFor[k])});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>game?.held.delete(keyFor[k]))});
function translate(){document.documentElement.lang=lang;document.title=tr().title+' — '+tr().kicker;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr()[e.dataset.i]||'');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));if(game)hud()}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;translate()}));$('#start').addEventListener('click',()=>{game.started=true;ui.intro.hidden=true;msg('toastStart');last=performance.now();canvas.focus();if(matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()});$('#again').addEventListener('click',()=>{cancelAnimationFrame(raf);game=makeState();ui.ending.hidden=true;ui.intro.hidden=false;translate();hud();render();last=performance.now();raf=requestAnimationFrame(loop)});
