function update(dt){if(!game?.started||game.ending)return;game.elapsed+=dt;let p=game.player,h=game.held,dx=0,dy=0;if(h.has('up'))dy--;if(h.has('down'))dy++;if(h.has('left'))dx--;if(h.has('right'))dx++;let walking=dx||dy,blend=h.has('blend'),speed=h.has('sprint')?3.9:2.55,mx=0,my=0;if(walking){let n=Math.hypot(dx,dy);dx/=n;dy/=n;if(blend)speed=.62;mx=(-dy*Math.cos(p.a)-dx*Math.sin(p.a))*speed;my=(-dy*Math.sin(p.a)+dx*Math.cos(p.a))*speed;movePlayer(mx*dt,my*dt)}
